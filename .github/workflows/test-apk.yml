# Test build of andrewjose's branches (PlayStation, LCD Effect at Integer,
# per-system save folders) on upstream v2.2.1, for sideloading on a KONKR.
# Not part of any pull request: lives only on build/test-apk.
# The debug APK is "fyi.slot.konkr.diag", so it installs NEXT TO the official
# slot. without touching its data. It is signed with the fixed throwaway test
# key in .github/test-signing (password "android"), so each new test build
# installs as an update of the previous one. Steps are upstream's production
# workflow minus its tests; ScreenScraper secrets are upstream's own, so this
# build fetches no NES/SNES/Mega Drive labels.
name: Test APK

on:
  push:
    branches: ['build/test-apk']
  workflow_dispatch:

permissions:
  # contents: write publishes each APK as a prerelease (below).
  contents: write

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK packages
        run: |
          # GitHub hosted ubuntu includes Android SDK command-line tools.
          # setup-android@v3 currently tries to install removed "tools" package.
          MANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | sort -V | tail -1)"
          if [ -z "$MANAGER" ]; then echo "Android sdkmanager not installed" >&2; exit 1; fi
          # Google SDK's CDN occasionally returns a corrupt/truncated NDK ZIP.
          # A fresh hosted runner cannot reuse a partial download, so retry
          # the pinned NDK instead of failing a healthy source checkout.
          for attempt in 1 2 3 4; do
            if "$MANAGER" --sdk_root="$ANDROID_SDK_ROOT" --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" \
              && test -s "$ANDROID_SDK_ROOT/ndk/27.2.12479018/source.properties"; then
              echo "Verified Android NDK r27c installed (attempt $attempt)"
              break
            fi
            if [ "$attempt" -eq 4 ]; then
              echo "::error::Android NDK 27.2 download failed after four attempts"
              exit 1
            fi
            echo "::warning::Transient SDK/NDK download error, retry $attempt of 4"
            sleep $((attempt * 5))
          done
      - uses: dtolnay/rust-toolchain@master
        with:
          # Match rust-toolchain.toml (channel = "1.96") exactly.
          # "1.96.0" and "1.96" can install into DISTINCT rustup homes;
          # cargo reads the project's 1.96 override.
          toolchain: '1.96'
          targets: aarch64-linux-android
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Read app version
        run: |
          set -euo pipefail
          gradle=android/app/build.gradle.kts
          code="$(sed -nE 's/^ *versionCode = ([0-9]+)$/\1/p' "$gradle")"
          name="$(sed -nE 's/^ *versionName = "([^"]+)"$/\1/p' "$gradle")"
          test -n "$code" && test -n "$name"
          echo "VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$name" >> "$GITHUB_ENV"
          echo "slot. $name ($code)"
      - name: Kotlin compile and JVM tests (fail fast, before the cores)
        run: gradle --no-daemon -p android :app:testDebugUnitTest
      - name: Export Slot keycap graphics for Android Apps
        run: |
          cargo run --locked -p slot-ui --example export_apps_legend -- android/app/src/main/assets/apps_controls
          python3 - <<'PY'
          from pathlib import Path
          import struct
          for name in ('move', 'open', 'back'):
              data = (Path('android/app/src/main/assets/apps_controls') / f'{name}.png').read_bytes()
              assert data[:8] == bytes((137, 80, 78, 71, 13, 10, 26, 10))
              width, height = struct.unpack('>II', data[16:24])
              # Drawn at 3x: Slot's 24px band.
              assert width > 45 and height == 72, (name, width, height)
              print(f'Verified Slot legend {name}: {width}x{height}')
          PY
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Build mGBA arm64 libretro core
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          bash scripts/build-mgba-android.sh
      - name: Build gpSP arm64 libretro core
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          bash scripts/build-gpsp-android.sh
      - name: Build Gambatte arm64 libretro core
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          bash scripts/build-gambatte-android.sh
      - name: Build NES, SNES, Mega Drive and PlayStation arm64 libretro cores
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          for core in fceumm nestopia snes9x bsnes genesis_plus_gx picodrive pcsx_rearmed; do
            bash scripts/build-home-core-android.sh "$core"
          done
      - name: Assemble debug APK (fixed test key, side-by-side package)
        env:
          SLOT_SIGNING_STORE_FILE: ${{ github.workspace }}/.github/test-signing/debug.keystore
          SLOT_SIGNING_STORE_PASSWORD: android
          SLOT_SIGNING_KEY_ALIAS: androiddebugkey
          SLOT_SIGNING_KEY_PASSWORD: android
          # Internet Multiplayer relay (tools/slot-relay), host[:port], as
          # upstream's release build: a repository Actions variable.
          SLOT_RELAY_ADDR: ${{ vars.SLOT_RELAY_ADDR }}
        run: |
          set -euo pipefail
          test -n "$SLOT_RELAY_ADDR" || echo "::warning::SLOT_RELAY_ADDR not set: this APK cannot play Internet Multiplayer"
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          bash scripts/build-konkr-android.sh
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$APK" | head -1
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='fyi.slot.konkr.diag'"
          for core in slot_android mgba_libretro gpsp_libretro gambatte_libretro fceumm_libretro nestopia_libretro snes9x_libretro bsnes_libretro genesis_plus_gx_libretro picodrive_libretro pcsx_rearmed_libretro; do
            unzip -Z -1 "$APK" | grep -Fx "lib/arm64-v8a/lib${core}.so"
          done
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | grep -i "SHA-256"
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: slot-test-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      # Artifacts download only through Azure blob storage; a release asset
      # downloads from GitHub, so test builds can be fetched outside Actions.
      - name: Publish the APK as a test prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          BADGING="$("$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$APK" | head -1)"
          NAME="$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" <<<"$BADGING")"
          CODE="$(sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" <<<"$BADGING")"
          test -n "$NAME" && test -n "$CODE"
          TAG="test-v${NAME}-${CODE}-run${GITHUB_RUN_NUMBER}"
          FILE="slot-${NAME}-${CODE}-test-run${GITHUB_RUN_NUMBER}.apk"
          cp "$APK" "$FILE"
          gh release create "$TAG" "$FILE" --prerelease --target "$GITHUB_SHA" \
            --title "Test build ${NAME} (${CODE}), run ${GITHUB_RUN_NUMBER}" \
            --notes "Debug test build (fyi.slot.konkr.diag) of build/test-apk at ${GITHUB_SHA}. Not a release."
          echo "Published $TAG: $FILE"
