# andrewjose's slot. fork for the KONKR (PlayStation, TurboGrafx-CD, saves
# with the ROMs and the rest), on upstream v2.2.2. The fork no longer
# follows upstream (2026-11-23): this branch is the fork's main line.
# Every push builds the debug APK "fyi.slot.konkr.diag" (installs next to the
# official slot.), signed with the fixed throwaway test key in
# .github/test-signing (password "android") so each build installs over the
# last, and publishes it as release v2.2.2-fork.<run>, which the in-app
# updater offers. ScreenScraper secrets are upstream's own, so this build
# fetches no NES/SNES/Mega Drive labels. Commits that don't change the app
# use [skip ci].
name: Test APK

on:
  push:
    branches: ['build/test-apk', 'build/test-apk-v2.2.2']
  workflow_dispatch:

permissions:
  # contents: write publishes each APK as a prerelease (below).
  contents: write

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
      # Fork release number: versionName 2.2.2-fork.N, versionCode 357000 + N.
      SLOT_FORK_RUN: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, for release notes since the last fork release.
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK packages
        run: |
          # GitHub hosted ubuntu includes Android SDK command-line tools.
          # setup-android@v3 currently tries to install removed "tools" package.
          MANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | sort -V | tail -1)"
          if [ -z "$MANAGER" ]; then echo "Android sdkmanager not installed" >&2; exit 1; fi
          # Google SDK's CDN occasionally returns a corrupt/truncated NDK ZIP.
          # A fresh hosted runner cannot reuse a partial download, so retry
          # the pinned NDK instead of failing a healthy source checkout.
          for attempt in 1 2 3 4; do
            if "$MANAGER" --sdk_root="$ANDROID_SDK_ROOT" --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" \
              && test -s "$ANDROID_SDK_ROOT/ndk/27.2.12479018/source.properties"; then
              echo "Verified Android NDK r27c installed (attempt $attempt)"
              break
            fi
            if [ "$attempt" -eq 4 ]; then
              echo "::error::Android NDK 27.2 download failed after four attempts"
              exit 1
            fi
            echo "::warning::Transient SDK/NDK download error, retry $attempt of 4"
            sleep $((attempt * 5))
          done
      - uses: dtolnay/rust-toolchain@master
        with:
          # Match rust-toolchain.toml (channel = "1.96") exactly.
          # "1.96.0" and "1.96" can install into DISTINCT rustup homes;
          # cargo reads the project's 1.96 override.
          toolchain: '1.96'
          targets: aarch64-linux-android
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Read app version
        run: |
          set -euo pipefail
          gradle=android/app/build.gradle.kts
          code="$(sed -nE 's/^ *versionCode = ([0-9]+)$/\1/p' "$gradle")"
          name="$(sed -nE 's/^ *versionName = "([^"]+)"$/\1/p' "$gradle")"
          test -n "$code" && test -n "$name"
          code=$((code * 1000 + SLOT_FORK_RUN)); name="$name-fork.$SLOT_FORK_RUN"
          echo "VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$name" >> "$GITHUB_ENV"
          echo "slot. $name ($code)"
      - name: Regex patterns compile on Android's engine (ICU), not just the JVM's
        run: python3 tools/fork-dev/regex-icu-check.py android/app/src/main/java
      - name: Kotlin compile and JVM tests (fail fast, before the cores)
        run: gradle --no-daemon -p android :app:testDebugUnitTest
      - name: Export Slot keycap graphics for Android Apps
        run: |
          cargo run --locked -p slot-ui --example export_apps_legend -- android/app/src/main/assets/apps_controls
          python3 - <<'PY'
          from pathlib import Path
          import struct
          for name in ('move', 'open', 'back'):
              data = (Path('android/app/src/main/assets/apps_controls') / f'{name}.png').read_bytes()
              assert data[:8] == bytes((137, 80, 78, 71, 13, 10, 26, 10))
              width, height = struct.unpack('>II', data[16:24])
              # Drawn at 3x: Slot's 24px band.
              assert width > 45 and height == 72, (name, width, height)
              print(f'Verified Slot legend {name}: {width}x{height}')
          PY
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Build mGBA arm64 libretro core
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          bash scripts/build-mgba-android.sh
      - name: Build gpSP arm64 libretro core
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          bash scripts/build-gpsp-android.sh
      - name: Build Gambatte arm64 libretro core
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          bash scripts/build-gambatte-android.sh
      - name: Build NES, SNES, Mega Drive and PlayStation arm64 libretro cores
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          for core in fceumm nestopia snes9x bsnes genesis_plus_gx picodrive pcsx_rearmed mednafen_pce_fast; do
            bash scripts/build-home-core-android.sh "$core"
          done
      - name: Assemble debug APK (fixed test key, side-by-side package)
        env:
          SLOT_SIGNING_STORE_FILE: ${{ github.workspace }}/.github/test-signing/debug.keystore
          SLOT_SIGNING_STORE_PASSWORD: android
          SLOT_SIGNING_KEY_ALIAS: androiddebugkey
          SLOT_SIGNING_KEY_PASSWORD: android
          # Internet Multiplayer relay (tools/slot-relay), host[:port], as
          # upstream's release build: a repository Actions variable.
          SLOT_RELAY_ADDR: ${{ vars.SLOT_RELAY_ADDR }}
        run: |
          set -euo pipefail
          test -n "$SLOT_RELAY_ADDR" || echo "::warning::SLOT_RELAY_ADDR not set: this APK cannot play Internet Multiplayer"
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          bash scripts/build-konkr-android.sh
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$APK" | head -1
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='fyi.slot.konkr.diag'"
          for core in slot_android mgba_libretro gpsp_libretro gambatte_libretro fceumm_libretro nestopia_libretro snes9x_libretro bsnes_libretro genesis_plus_gx_libretro picodrive_libretro pcsx_rearmed_libretro mednafen_pce_fast_libretro; do
            unzip -Z -1 "$APK" | grep -Fx "lib/arm64-v8a/lib${core}.so"
          done
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | grep -i "SHA-256"
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: slot-test-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      # The fork's release: what the in-app updater offers (SlotUpdater
      # reads andrewjose/slot-for-kpa, tag vX.Y.Z-fork.N, APK
      # slot-for-android-<version>-arm64.apk, SHA256SUMS.txt). The APK holds
      # no BIOS: personal builds add theirs outside CI and are never published.
      # A commit that doesn't change the app says [skip ci] and makes none.
      - name: Publish the fork release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          BADGING="$("$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$APK" | head -1)"
          NAME="$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" <<<"$BADGING")"
          CODE="$(sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" <<<"$BADGING")"
          [[ "$NAME" == *-fork."$SLOT_FORK_RUN" ]] || { echo "Unexpected versionName $NAME" >&2; exit 1; }
          if unzip -Z -1 "$APK" | grep -q '^assets/bios/'; then echo "BIOS in the APK: refusing to publish" >&2; exit 1; fi
          TAG="v${NAME}"
          FILE="slot-for-android-${NAME}-arm64.apk"
          cp "$APK" "$FILE"
          sha256sum "$FILE" > SHA256SUMS.txt
          PREV="$(git tag --list 'v*-fork.*' --sort=-version:refname | head -1)"
          {
            echo "slot. for KONKR, andrewjose's fork: ${NAME} (code ${CODE}), CI run ${SLOT_FORK_RUN}."
            echo
            if [ -n "$PREV" ]; then echo "Changes since ${PREV}:"; git log --no-merges --pretty='- %s' "${PREV}..${GITHUB_SHA}";
            else echo "First fork release."; fi
          } > notes.md
          gh release create "$TAG" "$FILE" SHA256SUMS.txt --target "$GITHUB_SHA" --latest \
            --title "slot. ${NAME}" --notes-file notes.md
          echo "Published $TAG: $FILE"
